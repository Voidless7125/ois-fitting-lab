name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Rebuild index.html and data.json from src/ and game-data/
        run: python3 tools/build.py
      - name: Fail if the committed build is stale
        run: |
          git diff --exit-code -- index.html data/data.json || {
            echo "::error::index.html or data/data.json is out of date. Run 'python3 tools/build.py' and commit the result."
            exit 1
          }
      - name: Core maths tests
        run: |
          node tools/test_core.js | tee test.log
          grep -q "core tests pass" test.log
